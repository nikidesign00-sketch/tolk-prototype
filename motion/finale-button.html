<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Плюс → Готово · движение</title>
<style>@import url('/src/styles/tokens.css');@import url('/src/styles/base.css');@import url('/src/screens/onboarding/onboarding-flow.css');
body{margin:0;background:var(--surface-subtle);color:var(--text-primary);font-family:Onest,sans-serif;padding:32px}main{max-width:1240px;margin:auto}h1{font-size:28px;font-weight:500;margin:0 0 12px}p{line-height:1.5}header p{max-width:700px;color:var(--text-secondary)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:32px}article{min-width:0}h2{font-size:18px;font-weight:500}article p{min-height:72px;color:var(--text-secondary);font-size:14px}.stage{height:300px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:34px;border-radius:40px;background:radial-gradient(ellipse at 22% 0%,var(--accent-100),transparent 70%),linear-gradient(var(--accent-400),var(--accent-600) 58%,var(--accent-800));overflow:hidden}.own-main-btn{flex:none;width:80px;min-width:0;padding:0;transition:none}.own-main-btn__icon,.own-main-btn__text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;transition:none!important}.own-main-btn__text{opacity:0;pointer-events:none}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.control{font:inherit;border:0;border-radius:24px;background:var(--surface-default);color:var(--text-primary);padding:12px 20px;cursor:pointer;min-height:44px}select{font:inherit;border:0;border-radius:24px;padding:12px;background:var(--surface-default)}.note{font-size:13px;color:var(--text-secondary)}@media(max-width:800px){.grid{grid-template-columns:1fr}body{padding:20px}.stage{height:240px}article p{min-height:0}}</style>
<main><header><h1>Плюс → Готово</h1><p>Нажмите белый плюс или запустите все варианты одновременно. Размеры кнопки сохранены: 80 → 127 × 52 px. Здесь показана смена состояния после закрытия формы задачи.</p></header><div class="controls"><button class="control" id="all">Сравнить все</button><button class="control" id="reset">Сбросить</button><select aria-label="Скорость"><option value="1">Обычная скорость</option><option value="2.5">Замедленно ×2,5</option></select></div><section class="grid"></section><p class="note">Изолированная проба. Основной экран не изменён. При включённом уменьшении движения переход мгновенный.</p></main>
<script>
const configs=[{name:'1. Мягкая пружина · рекомендую',description:'Ширина слегка проходит конечный размер и спокойно возвращается. Плюс гаснет, текст появляется чуть позже. 520 мс.',duration:520,zeta:.72,omega:13,lift:0},{name:'2. Упругий морф',description:'Небольшое сжатие перед расширением и заметнее отскок. Более выразительный, но привлекает больше внимания. 620 мс.',duration:620,zeta:.52,omega:13,lift:1},{name:'3. Спокойное раскрытие',description:'Непрерывное расширение без перелёта. Текст мягко проявляется из центра. Самый сдержанный вариант. 420 мс.',duration:420,zeta:1,omega:10,lift:0}];
const grid=document.querySelector('.grid');
configs.forEach((c,i)=>{const a=document.createElement('article');a.innerHTML=`<h2>${c.name}</h2><p>${c.description}</p><div class="stage"><button class="own-main-btn" aria-label="Показать переход"><span class="own-main-btn__icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><span class="own-main-btn__text">Готово</span></button></div>`;grid.append(a);c.button=a.querySelector('button');c.button.onclick=()=>play(c)});
function reset(c){(c.animations||[]).forEach(a=>a.cancel());c.button.style.width='80px';c.button.style.transform='none';c.button.querySelector('.own-main-btn__icon').style.opacity=1;c.button.querySelector('.own-main-btn__text').style.opacity=0}
function play(c){reset(c);const b=c.button,icon=b.children[0],label=b.children[1];if(matchMedia('(prefers-reduced-motion: reduce)').matches){b.style.width='127px';icon.style.opacity=0;label.style.opacity=1;return}const duration=c.duration*Number(document.querySelector('select').value);const frames=[];for(let i=0;i<=160;i++){const t=i/160;let v;if(c.zeta===1)v=(1-Math.exp(-7*t))/(1-Math.exp(-7));else{const st=c.lift?Math.max(0,(t-.12)/.88):t;const w=c.omega*Math.sqrt(1-c.zeta*c.zeta);v=1-Math.exp(-c.zeta*c.omega*st)*(Math.cos(w*st)+c.zeta/Math.sqrt(1-c.zeta*c.zeta)*Math.sin(w*st));}if(c.lift&&t<.12)v=-.06*Math.sin(t/.12*Math.PI);frames.push({offset:t,width:`${80+47*(i===160?1:v)}px`,transform:`translateY(${-c.lift*2*Math.sin(Math.PI*t)}px)`})}b.style.width='127px';icon.style.opacity=0;label.style.opacity=1;c.animations=[b.animate(frames,{duration,easing:'linear'}),icon.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.72)'}],{duration:duration*.32,easing:'cubic-bezier(.2,.7,.2,1)'}),label.animate([{opacity:0,transform:'translateY(4px) scale(.94)'},{opacity:1,transform:'translateY(0) scale(1)'}],{delay:duration*.18,duration:duration*.62,fill:'backwards',easing:'cubic-bezier(.16,1,.3,1)'})]}
document.querySelector('#all').onclick=()=>configs.forEach(play);document.querySelector('#reset').onclick=()=>configs.forEach(reset);
</script></html>
